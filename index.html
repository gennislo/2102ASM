<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ASM Pronunciation & Syllables</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --accent: #eff6ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px 12px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; color: var(--primary); }
    .nav-tabs { display: flex; background: var(--border); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; font-weight: 600; border: none; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; min-height: 48px; }
    .tab-btn.active { background: var(--card-bg); color: var(--primary); }
    .view-panel { display: none; }
    .view-panel.active { display: block; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; min-height: 48px; width: 100%; display: flex; align-items: center; justify-content: center; }
    .btn-sec { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .flashcard-wrapper { perspective: 1000px; margin: 0 auto 16px; width: 100%; max-width: 400px; height: 280px; }
    .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .card-back { transform: rotateY(180deg); background: #fafafa; }
    .main-word { font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
    .syllables { font-size: 1.6rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .card-nav { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
    .search-bar { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; margin-bottom: 16px; min-height: 48px; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .word-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .audio-btn { background: var(--accent); color: var(--primary); border: none; padding: 8px; border-radius: 50%; cursor: pointer; min-width: 40px; min-height: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pronunciation & Syllables</h1>
      <p style="color:var(--muted); font-size:0.85rem;">ASM Vocabulary Practice</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('flashcardsTab')">🎴 Flashcards</button>
      <button class="tab-btn" onclick="switchTab('listTab')">📋 Word List</button>
    </div>

    <div id="flashcardsTab" class="view-panel active">
      <div class="flashcard-wrapper" id="cardWrapper">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="main-word" id="frontWord">accommodate</div>
            <button class="btn btn-sec" onclick="event.stopPropagation(); playCurrentWord();">🔊 Hear Word</button>
          </div>
          <div class="card-face card-back">
            <div style="font-size:0.75rem; color:var(--muted); text-transform:uppercase;">Syllables & Stress</div>
            <div class="syllables" id="backSyllables">ac·COM·mo·date</div>
            <button class="btn btn-sec" onclick="event.stopPropagation(); playCurrentWord();">🔊 Play Audio</button>
            <div id="backRelated" style="margin-top:8px;"></div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button class="btn btn-sec" onclick="prevCard()">← Prev</button>
        <button class="btn btn-sec" onclick="shuffleCards()">🎲</button>
        <button class="btn btn-sec" onclick="nextCard()">Next →</button>
      </div>
    </div>

    <div id="listTab" class="view-panel">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search words...">
      <div class="word-grid" id="wordGrid"></div>
    </div>
  </div>
